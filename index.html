<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pac Meme</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>Pac Meme</h1>
      <p class="help">Move with arrow keys or WASD. Collect all dots and avoid ghosts.</p>
      <div class="hud">
        <span id="score">Score: 0</span>
        <span id="lives">Lives: 3</span>
        <span id="status">Status: Running</span>
      </div>
      <canvas id="game" width="560" height="560" aria-label="Pac Meme game board"></canvas>
      <p class="note">
        Sprites are loaded from: <code>shockedgirl_sprite.png</code>,
        <code>diddy_sprite.png</code>, <code>epstein_sprite.png</code>,
        <code>babyoil_sprite.png</code>.
      </p>
    </main>
    <script src="game.js"></script>
  </body>
</html>
